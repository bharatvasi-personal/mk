name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres, not a mock: row-level security, the immutability triggers and the
    # gapless invoice sequence are database behaviour. Testing them against anything else
    # tests nothing.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mithilakitchen
          POSTGRES_USER: mk_owner
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd "pg_isready -U mk_owner"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://mk_app:ci_app_password@localhost:5432/mithilakitchen?schema=public
      DATABASE_MIGRATION_URL: postgresql://mk_owner:ci_password@localhost:5432/mithilakitchen?schema=public
      POSTGRES_DB: mithilakitchen
      POSTGRES_USER: mk_owner
      POSTGRES_PASSWORD: ci_password
      POSTGRES_APP_PASSWORD: ci_app_password
      REDIS_URL: redis://localhost:6379
      MASTER_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy0xMjM0NTY3OA==
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DEFAULT_TENANT_SLUG: mithilakitchen
      SEED_OWNER_PASSWORD: CiPassword@12345

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w @mk/shared
      - run: npm run test -w @mk/shared

      - name: Generate Prisma client
        run: npx --workspace @mk/api prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate and apply security objects
        run: |
          npm run db:migrate:deploy -w @mk/api
          npm run db:security -w @mk/api

      - name: Seed
        run: npm run db:seed -w @mk/api

      - name: Build
        run: npm run build

      - name: Start API and run the end-to-end smoke test
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf localhost:4000/api/health/ready && break
            sleep 2
          done
          node tests/smoke.mjs

      - name: Assert row-level security is actually on
        # A regression here would be silent and catastrophic, so it is asserted rather
        # than assumed. Every tenant-owned table must have a FORCEd isolation policy.
        run: |
          UNPROTECTED=$(psql "$DATABASE_MIGRATION_URL" -tAc "
            SELECT count(*) FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_attribute a ON a.attrelid = c.oid
            WHERE n.nspname='public' AND c.relkind='r'
              AND a.attname='tenant_id' AND NOT a.attisdropped
              AND NOT (c.relrowsecurity AND c.relforcerowsecurity)")
          echo "tables with tenant_id but no forced RLS: $UNPROTECTED"
          test "$UNPROTECTED" = "0"
